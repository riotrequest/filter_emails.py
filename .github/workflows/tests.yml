name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full history for secrets
        shell: bash
        run: |
          set -euo pipefail
          release=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location "$release/$archive" --output "$archive"
          curl --fail --silent --show-error --location "$release/gitleaks_8.30.1_checksums.txt" --output checksums.txt
          grep " $archive$" checksums.txt | sha256sum --check --strict -
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --no-banner --log-opts=--all "$GITHUB_WORKSPACE"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install .
      - run: greenarrow-spamtrap-review --help
        working-directory: ${{ runner.temp }}
